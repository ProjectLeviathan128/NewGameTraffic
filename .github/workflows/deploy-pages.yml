name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/gridlock-game-design-3a7CM]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          # Demo mode: use synthetic city data instead of requiring live API
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_DEFAULT_CITY: "portland"
          # Point to a deployed backend if you have one, otherwise demo mode takes over
          NEXT_PUBLIC_API_URL: ${{ vars.GRIDLOCK_API_URL || 'http://localhost:8000' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
