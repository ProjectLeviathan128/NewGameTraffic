name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/gridlock-game-design-3a7CM, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Static mode: use bundled Portland OSM/GTFS snapshot (no backend required).
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_DEFAULT_CITY: "portland"
          # Point to a deployed backend if you have one, otherwise demo mode takes over
          NEXT_PUBLIC_API_URL: ${{ vars.GRIDLOCK_API_URL || 'http://localhost:8000' }}
        run: npm run build

      - name: Add .nojekyll
        run: touch web/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
