name: Python Tests

on:
  push:
    branches: ["**"]
    paths:
      - "gridlock/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies (no heavy geospatial)
        run: |
          pip install -e . --no-deps
          pip install pytest pytest-asyncio numpy scipy networkx click pyyaml requests msgpack tqdm

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short -m "not integration"
